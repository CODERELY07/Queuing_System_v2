events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen 10000;
        server_name _;
        root /var/www/html/public;

        index index.php index.html;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Reverb's WebSocket endpoint (Laravel Echo connects to
        # /app/{key}) and its HTTP API (/apps/{id}/..., used server-side
        # for broadcasting). Reverb is its own process listening on
        # 127.0.0.1:8080 (see supervisord.conf) — it's not part of the
        # Laravel app nginx otherwise proxies to PHP-FPM, so without this
        # block both paths fall through to the catch-all above and get
        # routed into Laravel instead, which has no such route and can
        # never upgrade the connection. This is why the browser's
        # `wss://.../app/{key}` handshake failed even once Reverb itself
        # was running.
        location ~ ^/(app|apps)/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include fastcgi_params;
        }

        location ~ /\.ht {
            deny all;
        }
    }
}
